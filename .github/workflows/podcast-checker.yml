name: Podcast checker

permissions:
  contents: write   # nodig om verwerkte_afleveringen.json terug te committen naar de repo

on:
  schedule:
    - cron: '0 16 * * *'   # 16:00 UTC = 18:00 Nederlandse tijd (zomertijd, CEST) — zie toelichting over wintertijd
  workflow_dispatch:        # hiermee kun je 'm ook handmatig starten vanuit de Actions-tab

jobs:
  check-podcasts:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'   # scheelt 30-60s per run na de eerste keer

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: ffmpeg installeren
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Script draaien
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONUNBUFFERED: "1"   # zorgt dat print()-regels meteen zichtbaar zijn in de log, i.p.v. pas aan het eind
        run: python podcast_automatisering.py

      - name: Bijgewerkte lijst met verwerkte afleveringen terugschrijven
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          if [ -f verwerkte_afleveringen.json ]; then
            git add verwerkte_afleveringen.json
            git diff --staged --quiet || git commit -m "Update verwerkte afleveringen"
            git push
          else
            echo "verwerkte_afleveringen.json bestaat nog niet — niets om te committen (geen enkele upload gelukt deze run)."
          fi
